# Render Blueprint — backend ICPE + baza PostgreSQL.
# W Render: New ▸ Blueprint ▸ wskaż to repo. Wartości ADMIN_* uzupełnisz w panelu.
databases:
  - name: icpe-db
    databaseName: icpe
    user: icpe
    plan: basic-256mb   # baza podniesiona z 'free' na płatną w panelu Render (2026-08).
                        # NIE wpisuj tu z powrotem 'free' — Render nie pozwala degradować planu
                        # i cały sync Blueprintu wywala się błędem "cannot downgrade database".

services:
  - type: web
    name: icpe-api
    runtime: node
    plan: free          # darmowy web usypia po bezczynności; do produkcji zmień na płatny
    rootDir: .
    buildCommand: npm install && npm --workspace=api run build
    startCommand: cd api && npx prisma db push --skip-generate && node dist/main.js
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icpe-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SERVICE_TOKEN          # token dla Personal OS — odczytasz go z panelu Render
        generateValue: true
      - key: ADMIN_EMAIL            # login do panelu admina — ustaw w panelu Render
        sync: false
      - key: ADMIN_PASSWORD         # hasło do panelu admina — ustaw w panelu Render
        sync: false
      - key: CORS_ORIGIN
        value: https://rejestracja.icpemission.pl
      # Bazowy adres publicznego frontu — z niego budowane są linki /i/:token
      # w mailach z zaproszeniem. Gdy pusty, fallback: CORS_ORIGIN.
      - key: PUBLIC_APP_URL
        value: https://rejestracja.icpemission.pl
      # ── Płatności online (Tpay) — docs/20-plan-wdrozenie-tpay.md ──
      # Wszystkie wartości ustawiasz w panelu Render (sync:false — Blueprint ich nie nadpisuje;
      # dotąd PAYMENTS_MODE miało tu wpisane `mock`, co przy każdym pushu cofałoby przełączenie na `tpay`).
      # Brak wartości = `mock` (płatności online wyłączone, GET /payments/config zwraca pustą listę).
      - key: PAYMENTS_MODE             # 'mock' (domyślnie) | 'tpay'
        sync: false
      - key: TPAY_ENV                  # 'sandbox' (domyślnie) | 'production'
        sync: false
      - key: TPAY_CLIENT_ID            # klucz Open API (panel Tpay ▸ Integracja ▸ API)
        sync: false
      - key: TPAY_CLIENT_SECRET        # sekret Open API (widoczny w panelu Tpay tylko raz)
        sync: false
      - key: TPAY_MERCHANT_ID          # ID sprzedawcy — porównywane z polem `id` powiadomienia
        sync: false
      - key: TPAY_SECURITY_CODE        # kod bezpieczeństwa (panel Tpay ▸ Ustawienia ▸ Powiadomienia) do md5sum
        sync: false
      - key: API_PUBLIC_URL            # publiczny adres API (https://…, bez końcowego /) — z niego powstaje adres powiadomień
        sync: false
      - key: TPAY_ALLOW_TEST_MODE      # 'true' | 'false' (domyślnie false): na PRODUKCJI przyjmuj powiadomienia z test_mode=1 (tryb testowy konta); po testach ustaw false
        sync: false
      - key: TPAY_ROOT_CA_PEM          # opcjonalnie: treść root CA Tpay (PEM); bez niej root CA pobierany z oficjalnego adresu
        sync: false
      # Dashboard eventu w panelu (sekcje z PostHoga): klucz osobisty PostHog z zakresem „Endpoint: Read”
      # (PostHog ▸ Settings ▸ Personal API keys). Bez klucza dashboard działa, tylko bez lejka i źródeł.
      - key: POSTHOG_PERSONAL_API_KEY
        sync: false
      - key: TPAY_ROOT_CA_FILE         # opcjonalnie: ścieżka do pliku z root CA Tpay (zamiast TPAY_ROOT_CA_PEM)
        sync: false
      # Mail: ustaw w panelu Render (Blueprint nie nadpisuje — sync:false).
      # Zalecane: Resend — wklej RESEND_API_KEY, a MAIL_MODE ustaw na 'resend' (albo zostaw puste:
      # sam klucz włącza Resend). Stan i mail testowy: panel ▸ Ustawienia ▸ E-mail.
      - key: MAIL_MODE          # 'resend' | 'smtp' | 'log' (puste + RESEND_API_KEY = resend)
        sync: false
      - key: RESEND_API_KEY     # re_… z Resend ▸ API Keys (Sending access); domena musi być zweryfikowana
        sync: false
      - key: MAIL_FROM          # np. "ICPE Mission <rejestracja@icpemission.pl>" — domena zweryfikowana w Resend
        sync: false
      - key: MAIL_REPLY_TO      # opcjonalnie: adres na odpowiedzi, np. warszawa@icpemission.pl
        sync: false
      - key: SMTP_HOST          # np. smtp.poczta-domeny.pl
        sync: false
      - key: SMTP_PORT          # 587 (STARTTLS) lub 465 (SSL)
        sync: false
      - key: SMTP_SECURE        # 'true' dla portu 465, w innym wypadku 'false'
        sync: false
      - key: SMTP_USER          # login skrzynki
        sync: false
      - key: SMTP_PASS          # hasło skrzynki
        sync: false
      # CMS strony ICPE Mission PL — Deploy Hook static-site'u Astro.
      # Skopiuj z panelu Render (Static Site ▸ Settings ▸ Deploy Hook). Gdy pusty,
      # publikacja treści tylko loguje zdarzenie (bez rebuildu). Blueprint nie nadpisuje.
      - key: SITE_DEPLOY_HOOK_URL
        sync: false
      # ── Formacja online (panel kursanta) — docs/13-handoff-formacja-online.md ──
      - key: MEMBER_JWT_SECRET      # osobny sekret tokenów kursantów (≠ JWT_SECRET admina)
        generateValue: true
      - key: FILE_SIGNING_SECRET    # podpisy krótko żyjących linków do PDF
        generateValue: true
      - key: PRIVACY_POLICY_URL     # opcjonalny link do polityki prywatności w mailu „udział potwierdzony"
        sync: false
      - key: PUBLIC_SITE_URL        # linki w mailach: <PUBLIC_SITE_URL>/formacja/<slug>/
        value: https://icpemission.pl
      - key: R2_ACCOUNT_ID             # Cloudflare ▸ R2 ▸ Overview ▸ Account ID (hosting filmów kursów)
        sync: false
      - key: R2_BUCKET                 # nazwa bucketu R2, np. icpe-kursy
        sync: false
      - key: R2_ACCESS_KEY_ID          # Cloudflare ▸ R2 ▸ Manage API tokens ▸ Access Key ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY      # Cloudflare ▸ R2 ▸ Manage API tokens ▸ Secret Access Key
        sync: false
      - key: R2_ENDPOINT               # opcjonalnie: tylko dla bucketu z jurysdykcją UE, np. https://<konto>.eu.r2.cloudflarestorage.com
        sync: false
      - key: ICPE_GO_API_KEY           # opcjonalnie: klucz dla aplikacji ICPE Go (Authorization: Bearer … lub ?key=); puste = API /icpe-go publiczne
        sync: false
      - key: CRON_SECRET               # opcjonalnie: wymagany ?key= dla GET /cron/course-releases (publikacja zaplanowanych materiałów)
        sync: false
