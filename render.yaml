# Render Blueprint — backend ICPE + baza PostgreSQL.
# W Render: New ▸ Blueprint ▸ wskaż to repo. Wartości ADMIN_* uzupełnisz w panelu.
databases:
  - name: icpe-db
    databaseName: icpe
    user: icpe
    plan: basic-256mb   # baza podniesiona z 'free' na płatną w panelu Render (2026-08).
                        # NIE wpisuj tu z powrotem 'free' — Render nie pozwala degradować planu
                        # i cały sync Blueprintu wywala się błędem "cannot downgrade database".

services:
  - type: web
    name: icpe-api
    runtime: node
    plan: free          # darmowy web usypia po bezczynności; do produkcji zmień na płatny
    rootDir: .
    buildCommand: npm install && npm --workspace=api run build
    startCommand: cd api && npx prisma db push --skip-generate && node dist/main.js
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icpe-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SERVICE_TOKEN          # token dla Personal OS — odczytasz go z panelu Render
        generateValue: true
      - key: ADMIN_EMAIL            # login do panelu admina — ustaw w panelu Render
        sync: false
      - key: ADMIN_PASSWORD         # hasło do panelu admina — ustaw w panelu Render
        sync: false
      - key: CORS_ORIGIN
        value: https://rejestracja.icpemission.pl
      # Bazowy adres publicznego frontu — z niego budowane są linki /i/:token
      # w mailach z zaproszeniem. Gdy pusty, fallback: CORS_ORIGIN.
      - key: PUBLIC_APP_URL
        value: https://rejestracja.icpemission.pl
      - key: PAYMENTS_MODE
        value: mock
      # Mail: ustaw w panelu Render (Blueprint nie nadpisuje — sync:false).
      # Zalecane: Resend — wklej RESEND_API_KEY, a MAIL_MODE ustaw na 'resend' (albo zostaw puste:
      # sam klucz włącza Resend). Stan i mail testowy: panel ▸ Ustawienia ▸ E-mail.
      - key: MAIL_MODE          # 'resend' | 'smtp' | 'log' (puste + RESEND_API_KEY = resend)
        sync: false
      - key: RESEND_API_KEY     # re_… z Resend ▸ API Keys (Sending access); domena musi być zweryfikowana
        sync: false
      - key: MAIL_FROM          # np. "ICPE Mission <rejestracja@icpemission.pl>" — domena zweryfikowana w Resend
        sync: false
      - key: MAIL_REPLY_TO      # opcjonalnie: adres na odpowiedzi, np. warszawa@icpemission.pl
        sync: false
      - key: SMTP_HOST          # np. smtp.poczta-domeny.pl
        sync: false
      - key: SMTP_PORT          # 587 (STARTTLS) lub 465 (SSL)
        sync: false
      - key: SMTP_SECURE        # 'true' dla portu 465, w innym wypadku 'false'
        sync: false
      - key: SMTP_USER          # login skrzynki
        sync: false
      - key: SMTP_PASS          # hasło skrzynki
        sync: false
      # CMS strony ICPE Mission PL — Deploy Hook static-site'u Astro.
      # Skopiuj z panelu Render (Static Site ▸ Settings ▸ Deploy Hook). Gdy pusty,
      # publikacja treści tylko loguje zdarzenie (bez rebuildu). Blueprint nie nadpisuje.
      - key: SITE_DEPLOY_HOOK_URL
        sync: false
      # ── Formacja online (panel kursanta) — docs/13-handoff-formacja-online.md ──
      - key: MEMBER_JWT_SECRET      # osobny sekret tokenów kursantów (≠ JWT_SECRET admina)
        generateValue: true
      - key: FILE_SIGNING_SECRET    # podpisy krótko żyjących linków do PDF
        generateValue: true
      - key: PRIVACY_POLICY_URL     # opcjonalny link do polityki prywatności w mailu „udział potwierdzony"
        sync: false
      - key: PUBLIC_SITE_URL        # linki w mailach: <PUBLIC_SITE_URL>/formacja/<slug>/
        value: https://icpemission.pl
      - key: BUNNY_STREAM_LIBRARY_ID    # Bunny ▸ Stream ▸ biblioteka ▸ API ▸ Video Library ID
        sync: false
      - key: BUNNY_STREAM_API_KEY       # Bunny ▸ Stream ▸ biblioteka ▸ API ▸ API Key
        sync: false
      - key: BUNNY_STREAM_TOKEN_KEY     # Bunny ▸ Stream ▸ biblioteka ▸ Security ▸ Token authentication key
        sync: false
      - key: BUNNY_STREAM_CDN_HOSTNAME  # Bunny ▸ Stream ▸ biblioteka ▸ API ▸ CDN Hostname (miniatury), np. vz-xxxx.b-cdn.net
        sync: false
      - key: BUNNY_STREAM_WEBHOOK_KEY   # opcjonalnie: Read-only API key — weryfikacja podpisu webhooka
        sync: false
      - key: CRON_SECRET               # opcjonalnie: wymagany ?key= dla GET /cron/course-releases (publikacja zaplanowanych materiałów)
        sync: false
